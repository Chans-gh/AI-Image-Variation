[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "image-variations-skill"
version = "0.1.1"
description = "Provider-native image variations with host planning and explicit visual review"
requires-python = ">=3.11"
dependencies = ["Pillow>=13,<14", "jsonschema>=4.23,<5", "filelock>=4.2.1,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12", "PyYAML>=6,<7"]

[project.scripts]
image-variations = "image_variations.cli:main"
image-content-publishing = "image_content_publishing.cli:main"

[tool.setuptools]
packages = ["image_variations", "image_variations.adapters", "image_content_publishing", "shared"]
package-dir = {image_variations = "skills/image-variations/scripts/image_variations", image_content_publishing = "skills/image-content-publishing/scripts/image_content_publishing", shared = "shared"}

[tool.setuptools.data-files]
"share/image-variations" = ["skills/image-variations/SKILL.md"]
"share/image-variations/references" = ["skills/image-variations/references/*.json", "skills/image-variations/references/*.md"]
"share/image-variations/references/prompts" = ["skills/image-variations/references/prompts/*.txt"]
"share/image-variations/references/directions" = ["skills/image-variations/references/directions/*.txt", "skills/image-variations/references/directions/registry.json"]
"share/image-variations/references/profiles" = ["skills/image-variations/references/profiles/*.json"]
"share/image-variations/references/contracts" = ["contracts/*.json"]
"share/image-content-publishing" = ["skills/image-content-publishing/SKILL.md"]
"share/image-content-publishing/references" = ["skills/image-content-publishing/references/*.md", "skills/image-content-publishing/references/platform-config.json", "skills/image-variations/references/directions/registry.json"]
"share/image-content-publishing/references/contracts" = ["skills/image-content-publishing/references/contracts/*.json", "contracts/image-artifact-1.0.schema.json", "contracts/image-artifact-1.1.schema.json", "contracts/delivery-package.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
