name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Verify standalone Skill ZIP
        run: |
          uv run --locked python scripts/build_skill.py
          python -m zipfile -e dist/image-variations-0.1.0.zip "$RUNNER_TEMP/skill01"
          cd "$RUNNER_TEMP/skill01"
          entry=image-variations/scripts/run_task.py
          "$GITHUB_WORKSPACE/.venv/bin/python" "$entry" demo --mode grid --grid-size 3 --job grid-job --output results
          "$GITHUB_WORKSPACE/.venv/bin/python" "$entry" demo --mode sequence --count 4 --branch narrative --job sequence-job --output results

  tests-py39:
    name: tests-py39
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/skill-wheel" .
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Verify the wheel rejects Python 3.9
        run: |
          if python -m pip install --dry-run --no-deps "$RUNNER_TEMP"/skill-wheel/*.whl > "$RUNNER_TEMP/compat.log" 2>&1; then
            cat "$RUNNER_TEMP/compat.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/compat.log"
          grep -F 'requires a different Python' "$RUNNER_TEMP/compat.log"
          grep -F '>=3.11' "$RUNNER_TEMP/compat.log"
